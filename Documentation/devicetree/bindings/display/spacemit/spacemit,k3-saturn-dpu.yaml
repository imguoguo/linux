%YAML 1.2
---
$id: http://devicetree.org/schemas/display/spacemit/spacemit,k3-saturn-dpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SpaceMiT K3 Saturn Display Processing Unit

maintainers:
  - Cody Kang <cody.kang.hk@outlook.com>

description:
  The Saturn DPU is the K3 SoC's display processing unit. It is a SoC-specific
  IP (not derived from VeriSilicon DC8200) and feeds a downstream DisplayPort
  or embedded DisplayPort controller through an OF graph endpoint. The K3
  instantiates two independent DPUs - DPU0 drives the eDP path (register base
  0xc0340000) and DPU1 drives the external DP path (register base 0xc0440000).

properties:
  compatible:
    const: spacemit,k3-saturn-dpu

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    items:
      - description: online (live-display) IRQ
      - description: offline (writeback) IRQ

  interrupt-names:
    minItems: 1
    items:
      - const: online
      - const: offline

  clocks:
    description:
      Pixel, memory, AXI, escape, and DSC clocks. The K3 hardware also routes
      an AHB-bus clock to DPU0's MIPI DSI block, but mainline does not use
      DSI on this SoC; describe only the five clocks the driver consumes.
    maxItems: 5

  clock-names:
    items:
      - const: pxclk
      - const: mclk
      - const: aclk
      - const: escclk
      - const: dscclk

  resets:
    maxItems: 5

  reset-names:
    items:
      - const: mclk
      - const: lcd
      - const: esc
      - const: aclk
      - const: dsc

  power-domains:
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: Video output toward DP / eDP controller.

    required:
      - port@0

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - ports

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/spacemit,k3-clocks.h>
    #include <dt-bindings/pmu/k3_pmu.h>
    #include <dt-bindings/reset/spacemit,k3-resets.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        dpu@c0340000 {
            compatible = "spacemit,k3-saturn-dpu";
            reg = <0x0 0xc0340000 0x0 0x54000>;
            interrupts = <90 IRQ_TYPE_LEVEL_HIGH>,
                         <89 IRQ_TYPE_LEVEL_HIGH>;
            interrupt-names = "online", "offline";
            clocks = <&syscon_apmu CLK_APMU_LCD_PXCLK>,
                     <&syscon_apmu CLK_APMU_LCD_MCLK>,
                     <&syscon_apmu CLK_APMU_DPU_ACLK>,
                     <&syscon_apmu CLK_APMU_DSI_ESC>,
                     <&syscon_apmu CLK_APMU_LCD_DSC>;
            clock-names = "pxclk", "mclk", "aclk", "escclk", "dscclk";
            resets = <&syscon_apmu RESET_APMU_LCD_MCLK>,
                     <&syscon_apmu RESET_APMU_LCD>,
                     <&syscon_apmu RESET_APMU_DSI_ESC>,
                     <&syscon_apmu RESET_APMU_DPU_ACLK>,
                     <&syscon_apmu RESET_APMU_LCD_DSCCLK>;
            reset-names = "mclk", "lcd", "esc", "aclk", "dsc";
            power-domains = <&power K3_PMU_LCD0_PWR_DOMAIN>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;

                port@0 {
                    reg = <0>;
                    endpoint {
                        remote-endpoint = <&edp0_in>;
                    };
                };
            };
        };
    };
